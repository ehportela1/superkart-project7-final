services:
  backend:
    build: ./backend
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:7860/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:7860
    depends_on:
      backend:
        condition: service_healthy